spring.application.name=catalogo-service
server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=db_msa_catalogo;encrypt=false;trustServerCertificate=true
spring.datasource.username=user_demo
spring.datasource.password=user_demo
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# CORS para Swagger UI
springdoc.swagger-ui.cors-enabled=true

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=51180
spring.data.redis.timeout=3000ms